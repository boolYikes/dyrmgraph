on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      MANIFEST_PG_USER: ${{ secrets.POSTGRES_USER }}
      MANIFEST_PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MANIFEST_PG_DB: ${{ secrets.POSTGRES_DB }}
      MANIFEST_PG_HOST: localhost
      MANIFEST_PG_PORT: 5432
      IMAGE_NAME: postgres:16
      MANIFEST_URL: http://data.gdeltproject.org/gdeltv2/lastupdate.txt

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingest/requirements.txt
          pip install 'apache-airflow==3.1.8' \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.12.txt \
            -r services/airflow/requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/services":"$GITHUB_WORKSPACE/services/airflow/plugins"
          ./scripts/run_tests.sh --ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: boolYikes/dyrmgraph
